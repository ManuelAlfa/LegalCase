# Por defecto RabbitMQ (desde 3.8) mata el canal de un consumer que no
# confirma (ack) un mensaje en 1.800.000 ms (30 min) — pensado para detectar
# consumers de verdad colgados, no para documentos legítimamente largos.
# Confirmado en pruebas reales (2026-08-24): procesar un PDF de 500 páginas
# solo en la conversión a imagen ya tarda ~16 min, antes de que empiece el
# OCR (que a su vez tiene su propio tope interno de hasta 25 min, ver
# OCR_TIMEOUT_SEGUNDOS en services/ocr-paddle/main.py) — sumado al resto del
# pipeline (foliado, clasificación, fragmentación, embeddings), el total
# puede superar los 30 min por defecto sin que nada esté realmente colgado.
# Cuando el timeout salta, RabbitMQ cierra el canal a la fuerza, lo que
# aborta la llamada HTTP en curso al microservicio de OCR desde el Worker
# (se ve como TaskCanceledException/"response ended prematurely", no como un
# error del propio OCR) y el documento entero falla y hay que reprocesarlo.
# Subido de 90 a 200 minutos el 2026-08-25 al subir OCR_TIMEOUT_SEGUNDOS de
# 25 a 150 min (ver ese comentario en docker-compose.yml) y el timeout del
# HttpClient del Worker .NET a 170 min (AddDocumentPipeline,
# Infrastructure) — este debe quedar por ENCIMA de ambos con margen.
# Subido de nuevo, 200 a 290 minutos, el 2026-09-03: el plazo de OCR_TIMEOUT_
# SEGUNDOS subió de 150 a 240 min (928 páginas reales de la Gaceta, ver ese
# comentario) y el HttpClient del Worker a 260 min — este debe seguir por
# ENCIMA de ambos con el mismo margen relativo.
consumer_timeout = 17400000

# El usuario "legalcase" (esperado por Api/Worker, ver ConnectionStrings:RabbitMq
# en appsettings.json de ambos) NO se crea solo con un volumen nuevo:
# RABBITMQ_DEFAULT_USER/PASS del docker-compose solo crea "admin". Se había
# intentado antes con rabbitmq-init.sh montado en
# /docker-entrypoint-init.d/ — confirmado el 2026-08-24 (migración a Docker
# Engine nativo) que ESE hook no existe en la imagen oficial de rabbitmq
# (es una convención de la imagen de Postgres, no de esta), así que ese
# script nunca se había ejecutado realmente; el usuario "legalcase" que
# funcionaba en sesiones anteriores era solo un resto manual que quedó
# guardado en el volumen, no algo reproducible. load_definitions sí es un
# mecanismo real y soportado por la imagen: se aplica en cada arranque, de
# forma idempotente (ver rabbitmq-definitions.json).
management.load_definitions = /etc/rabbitmq/definitions.json
